<div id="admin-container">
    <h2>Administración</h2>

    <div class="admin-card">
        <h3>Añadir artista</h3>
        <form id="form-artista">
            <label for="input-nombre">Nombre</label>
            <input type="text" id="input-nombre" name="nombre" placeholder="Nombre del artista" required>

            <label for="input-descripcion">Descripción</label>
            <textarea id="input-descripcion" name="descripcion" placeholder="Descripción del artista" rows="4"
                required></textarea>

            <label for="input-precio">Precio de la entrada (€)</label>
            <input type="number" id="input-precio" name="precio" placeholder="0.00" min="0" step="0.01" required>

            <label for="input-imagen">Imagen</label>
            <input type="file" id="input-imagen" name="imagen" accept="image/*" required>
            <div id="preview-imagen"></div>

            <div id="form-mensaje"></div>
            <button type="button" id="btn-guardar">Guardar artista</button>
        </form>
    </div>
</div>
